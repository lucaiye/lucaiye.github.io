<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071829">
<meta name="description" content="无尽冬日小工具 - 酱油瓶扶一下的实用计算工具合集">
<title>无尽冬日小工具</title>
<style>
  :root{
    --ice-bright:#d6f2ff;
    --ice-glow:#7fdcff;
    --gold-soft:#ffe9b0;
    --gold-warm:#ffd18a;
    --text:#e2f2fd;
    --text-dim:#8fb8d6;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    /* 圆润字体优先：幼圆 / 圆体 / 各类圆角黑体 */
    font-family:"Yuanti SC","YouYuan","幼圆","Hiragino Maru Gothic ProN",
                "PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",
                "Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    background:#071829;
  }

  /* ===== 背景层：更冷、更通透 ===== */
  .bg-layer{
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(ellipse 70% 55% at 18% 0%,  rgba(150,225,255,.34), transparent 62%),
      radial-gradient(ellipse 65% 50% at 85% 100%, rgba(170,215,255,.26), transparent 64%),
      radial-gradient(ellipse 80% 50% at 50% 40%,  rgba(210,240,255,.10), transparent 70%),
      linear-gradient(180deg,#08192b 0%,#0e2842 45%,#091c30 100%);
  }

  /* ===== 雪花层 ===== */
  .snow-layer{
    position:fixed; inset:0; z-index:-1;
    pointer-events:none; overflow:hidden;
  }
  .snow{
    position:absolute; top:-6vh;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px rgba(200,240,255,.95);
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    will-change:transform;
  }
  @keyframes fall{
    0%  { transform:translate3d(0,0,0); }
    100%{ transform:translate3d(var(--drift,0px),118vh,0); }
  }

  /* ===== 布局 ===== */
  .page{
    max-width:1080px;
    margin:0 auto;
    padding:64px 24px 48px;
  }

  /* ===== 头部 ===== */
  header{ text-align:center; margin-bottom:52px; }

  .eyebrow{
    display:inline-block;
    font-size:12px;
    letter-spacing:.36em;
    text-indent:.36em;
    color:var(--ice-bright);
    padding:7px 18px;
    border:1px solid rgba(180,235,255,.34);
    border-radius:100px;
    background:rgba(60,130,180,.22);
    box-shadow:0 0 22px rgba(140,220,255,.16) inset;
    margin-bottom:26px;
  }

  /* 标题：纯白冷调，带冰蓝光晕，不再是金色 */
  .title{
    font-size:clamp(30px,6vw,56px);
    font-weight:800;
    letter-spacing:.06em;
    line-height:1.3;
    padding:0 6px;
    background:linear-gradient(180deg,
      #ffffff 0%,
      #ffffff 40%,
      #e6f7ff 70%,
      #c3e8ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:titleGlow 4.5s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{
      filter:drop-shadow(0 0 16px rgba(160,225,255,.55))
             drop-shadow(0 2px 4px rgba(0,0,0,.45));
    }
    50%{
      filter:drop-shadow(0 0 28px rgba(190,240,255,.88))
             drop-shadow(0 0 6px rgba(130,215,255,.5))
             drop-shadow(0 2px 4px rgba(0,0,0,.45));
    }
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:26px auto 18px;
    max-width:400px;
  }
  .divider span{
    flex:1; height:1px;
    background:linear-gradient(90deg,transparent,rgba(180,235,255,.62),transparent);
  }
  .divider i{
    font-style:normal;
    font-size:15px;
    color:var(--ice-glow);
    text-shadow:0 0 14px rgba(140,220,255,.9);
  }

  .subtitle{
    font-size:13.5px;
    letter-spacing:.22em;
    text-indent:.22em;
    color:var(--text-dim);
  }

  /* ===== 卡片网格 ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(272px,1fr));
    gap:22px;
  }

  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:28px 26px 24px;
    border-radius:22px;
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    background:linear-gradient(155deg,rgba(60,135,185,.50) 0%,rgba(16,48,80,.74) 100%);
    border:1px solid rgba(180,235,255,.32);
    box-shadow:0 12px 32px rgba(0,0,0,.40),
               inset 0 1px 0 rgba(210,245,255,.18);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:transform .28s ease, border-color .28s ease, box-shadow .28s ease;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,rgba(200,240,255,.9),transparent);
    opacity:.6;
    transition:opacity .28s ease;
  }
  .card:hover,
  .card:focus-visible{
    transform:translateY(-6px);
    border-color:rgba(210,245,255,.7);
    box-shadow:0 20px 46px rgba(0,0,0,.48),
               0 0 30px rgba(150,225,255,.36),
               inset 0 1px 0 rgba(230,250,255,.26);
    outline:none;
  }
  .card:hover::before,
  .card:focus-visible::before{
    opacity:1;
  }

  .card-icon{
    width:54px; height:54px;
    display:grid; place-items:center;
    font-size:26px;
    border-radius:18px;
    background:linear-gradient(160deg,rgba(150,225,255,.30),rgba(50,125,180,.48));
    border:1px solid rgba(180,235,255,.42);
    box-shadow:inset 0 0 20px rgba(140,220,255,.24);
    transition:transform .3s ease;
  }
  .card:hover .card-icon{
    transform:rotate(-8deg) scale(1.1);
  }

  .card h2{
    font-size:18.5px;
    font-weight:700;
    letter-spacing:.05em;
    color:#f0faff;
  }

  .card p{
    font-size:13.5px;
    line-height:1.75;
    color:var(--text-dim);
  }

  .card-more{
    margin-top:auto;
    padding-top:6px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    letter-spacing:.12em;
    color:var(--ice-bright);
    opacity:.78;
    transition:opacity .28s ease, gap .28s ease;
  }
  .card:hover .card-more{ opacity:1; gap:11px; }

  /* ===== 占位卡 ===== */
  .card.placeholder{
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:10px;
    min-height:180px;
    border-style:dashed;
    border-color:rgba(180,235,255,.28);
    background:rgba(16,48,80,.30);
    box-shadow:none;
    cursor:default;
    transition:border-color .28s ease, background .28s ease;
  }
  .card.placeholder::before{ display:none; }
  .card.placeholder:hover{
    transform:none;
    border-color:rgba(180,235,255,.48);
    background:rgba(20,58,94,.42);
    box-shadow:none;
  }
  .card.placeholder .ph-icon{
    font-size:22px;
    opacity:.6;
  }
  .card.placeholder .ph-title{
    font-size:14px;
    letter-spacing:.18em;
    color:var(--text-dim);
  }
  .card.placeholder .ph-sub{
    font-size:12px;
    color:rgba(143,184,214,.65);
  }

  /* ===== 页脚 ===== */
  footer{
    margin-top:56px;
    text-align:center;
    font-size:12.5px;
    letter-spacing:.16em;
    color:rgba(143,184,214,.62);
    line-height:2;
  }
  footer .copyright{
    color:var(--ice-bright);
    opacity:.9;
    font-size:13px;
    letter-spacing:.12em;
    margin-bottom:6px;
  }
  footer .dot{
    display:inline-block;
    margin:0 8px;
    color:rgba(180,235,255,.42);
  }

  @media (max-width:600px){
    .page{ padding:42px 16px 32px; }
    header{ margin-bottom:38px; }
    .card{ padding:22px 20px 20px; border-radius:18px; }
    .card-icon{ width:48px; height:48px; font-size:23px; border-radius:15px; }
  }

  @media (prefers-reduced-motion:reduce){
    .snow{ display:none; }
    .card{ transition:none; }
    .title{ animation:none; }
    .card:hover .card-icon{ transform:none; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="snow-layer" id="snowLayer"></div>

<div class="page">

  <header>
    <div class="eyebrow">❄ Whiteout Survival ❄</div>
    <h1 class="title">无尽冬日小工具</h1>
    <div class="divider"><span></span><i>❄</i><span></span></div>
    <p class="subtitle">冰雪世界里的一点小便利</p>
  </header>

  <main class="grid">

    <!-- ===== 工具 1 ===== -->
    <a class="card" href="打熊队列计算.html">
      <div class="card-icon">🐻</div>
      <h2>打熊队列计算</h2>
      <p>计算集结队列的最优兵力配置，快速得出所需兵种与数量。</p>
      <div class="card-more">进入工具 <span>→</span></div>
    </a>

    <!-- ===== 工具 2 ===== -->
    <a class="card" href="领主装备升级材料计算.html">
      <div class="card-icon">⚔️</div>
      <h2>领主装备升级材料计算</h2>
      <p>输入当前等级与目标等级，自动算出所需材料总量与缺口。</p>
      <div class="card-more">进入工具 <span>→</span></div>
    </a>

    <!-- ===== 工具 3 ===== -->
    <a class="card" href="宝石装备升级材料计算.html">
      <div class="card-icon">💎</div>
      <h2>宝石装备升级材料计算</h2>
      <p>规划宝石装备升级路线，统计各级材料消耗与资源分配。</p>
      <div class="card-more">进入工具 <span>→</span></div>
    </a>

    <!-- ===== 预留位置：以后新增工具，复制上面任意一个 <a class="card"> 整块，改 href / 图标 / 标题 / 描述即可 ===== -->

    <!--
    <a class="card" href="新工具名称.html">
      <div class="card-icon">🛡️</div>
      <h2>新工具名称</h2>
      <p>这里写一句话说明这个工具是做什么的。</p>
      <div class="card-more">进入工具 <span>→</span></div>
    </a>
    -->

    <!-- 占位提示卡：新增工具后可删除 -->
    <div class="card placeholder">
      <div class="ph-icon">❄</div>
      <div class="ph-title">更多工具</div>
      <div class="ph-sub">敬请期待</div>
    </div>

  </main>

  <footer>
    <div class="copyright">by酱油瓶扶一下</div>
    <div>
      数据仅供参考
      <span class="dot">·</span>
      Powered by GitHub Pages
    </div>
  </footer>

</div>

<script>
  (function () {
    var layer = document.getElementById('snowLayer');
    if (!layer) return;

    var count = window.innerWidth < 700 ? 22 : 42;
    var frag = document.createDocumentFragment();

    for (var i = 0; i < count; i++) {
      var s = document.createElement('span');
      s.className = 'snow';

      var size = (Math.random() * 3 + 1.5).toFixed(1);
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (Math.random() * 100).toFixed(2) + '%';
      s.style.opacity = (Math.random() * 0.55 + 0.22).toFixed(2);
      s.style.animationDuration = (Math.random() * 12 + 11).toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * 22).toFixed(1) + 's';
      s.style.setProperty('--drift', (Math.random() * 90 - 45).toFixed(0) + 'px');

      frag.appendChild(s);
    }
    layer.appendChild(frag);
  })();
</script>

</body>
</html>
